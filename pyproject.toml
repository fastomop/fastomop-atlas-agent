[project]
name = "atlas-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "agno>=2.0.0",
    "anthropic>=0.42.0",
    "openai>=1.0.0",
    "pymilvus>=2.4.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "sentence-transformers>=2.5.0",
    "torch==2.7.0",
    "ollama",
    "tomli>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
