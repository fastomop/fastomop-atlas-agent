[project]
site_name = "OMOP Atlas Agent Documentation"
site_description = "Multi-agent system for automated ATLAS concept-set construction from natural-language clinical descriptions."
site_url = "https://fastomop.github.io/fastomop-atlas-agent/"
repo_name = "fastomop/fastomop-atlas-agent"
repo_url = "https://github.com/fastomop/fastomop-atlas-agent"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; FastOMOP contributors"
docs_dir = "docs"

nav = [
  { "Home" = "index.md" },
]

[project.theme]
variant = "classic"
features = [
  "navigation.instant",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.top",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
  "content.action.edit",
]

[project.theme.icon]
repo = "fontawesome/brands/github"
